name: Update data

# Keeps the site self-sufficient: refreshes daily prices, CPI, supply and the
# offline network snapshot, then commits. Vercel redeploys on the push to main.
on:
  schedule:
    - cron: "17 1 * * *" # daily, 01:17 UTC (after the UTC day closes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh history, CPI and supply
        run: python3 scripts/update-data.py
      - name: Refresh offline network snapshot
        run: python3 scripts/snapshot-network.py || echo "snapshot refresh failed; keeping previous file"
      - name: Commit if changed
        run: |
          if git diff --quiet -- dist/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/network-snapshot.json
          git commit -m "Update data $(date -u +%F)"
          # main may have moved since checkout (e.g. a merged PR); replay on top
          git pull --rebase origin main
          git push
